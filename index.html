<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Order</title>
<meta name="description" content="Pick your coffee, customise it, and send your order in one tap.">
<meta property="og:title" content="Coffee Order — Makati">
<meta property="og:description" content="Pick your coffee and send your order in one tap.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<style>
  :root {
    --bg: #f6f1ea; --card: #ffffff; --ink: #2a1f17; --muted: #7a6a5c;
    --line: #e4d9cc; --accent: #6b3e1f; --accent-ink: #ffffff; --soft: #efe4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1411; --card: #251d18; --ink: #f3e9de; --muted: #b3a291;
      --line: #3a2e26; --accent: #d39a6a; --accent-ink: #1a1411; --soft: #2f251f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 150px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
  .drinks { display: grid; gap: 10px; }
  .drink {
    display: block; background: var(--card); border: 2px solid var(--line);
    border-radius: 14px; padding: 14px 16px; cursor: pointer; position: relative;
  }
  .drink input { position: absolute; opacity: 0; }
  .drink:has(input:checked) { border-color: var(--accent); background: var(--soft); }
  .drink:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
  .drink .name { font-weight: 650; font-size: 17px; }
  .drink .where { font-size: 13px; color: var(--accent); font-weight: 600; }
  .drink .desc { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg label {
    flex: 1 1 auto; text-align: center; background: var(--card); border: 2px solid var(--line);
    border-radius: 999px; padding: 9px 14px; cursor: pointer; font-weight: 550; min-width: 80px;
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[type=text], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 2px solid var(--line); border-radius: 12px; padding: 11px 14px;
  }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 70px; resize: vertical; }
  .qty { display: flex; align-items: center; gap: 12px; }
  .qty button {
    width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 20px; cursor: pointer;
  }
  .qty output { font-size: 20px; font-weight: 650; min-width: 24px; text-align: center; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bar-in { max-width: 640px; margin: 0 auto; }
  .summary { font-size: 14px; color: var(--muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btns { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  .btn {
    border: 0; border-radius: 12px; padding: 13px 10px; font: inherit; font-weight: 650;
    cursor: pointer; background: var(--soft); color: var(--ink); text-align: center; text-decoration: none;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn[aria-disabled=true] { opacity: .45; pointer-events: none; }
  .toast {
    position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .hint { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap">
  <h1>☕ Coffee Order</h1>
  <p class="sub">Pick a drink, set it the way you like, then tap <b>Place order</b>.</p>

  <h2>Your name</h2>
  <input type="text" id="name" placeholder="e.g. Maria" autocomplete="given-name" maxlength="40">

  <h2>Drink</h2>
  <div class="drinks" id="drinks"></div>

  <h2>Hot or iced</h2>
  <div class="seg" data-group="temp"></div>

  <h2>Size</h2>
  <div class="seg" data-group="size"></div>

  <h2>Milk</h2>
  <div class="seg" data-group="milk"></div>

  <h2>Sugar level</h2>
  <div class="seg" data-group="sugar"></div>

  <h2>Quantity</h2>
  <div class="qty">
    <button type="button" id="minus" aria-label="Less">−</button>
    <output id="qty">1</output>
    <button type="button" id="plus" aria-label="More">+</button>
  </div>

  <h2>Notes (optional)</h2>
  <textarea id="notes" placeholder="Extra shot, less ice, decaf…" maxlength="200"></textarea>
  <p class="hint">Specialty drinks come from the café shown. Availability and exact recipe depend on the shop.</p>
</main>

<div class="bar">
  <div class="bar-in">
    <div class="summary" id="summary">Choose a drink to start</div>
    <div class="btns">
      <button class="btn primary" id="place" type="button" aria-disabled="true">Place order</button>
      <a class="btn" id="send" href="#" aria-disabled="true">Share</a>
      <button class="btn" id="copy" type="button" aria-disabled="true">Copy</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const DRINKS = [
  { id: "americano", name: "Classic Americano", where: "", desc: "Espresso with hot or iced water. Bold and clean, no dairy needed." },
  { id: "latte", name: "Caffè Latte", where: "", desc: "Espresso with steamed milk and a thin layer of foam. Smooth and balanced." },
  { id: "yardstick", name: "Sea Salt Latte", where: "Yardstick Coffee · Esteban St, Legazpi Village", desc: "Their best seller. Espresso and milk under a lightly salted cream — sweet meets savoury." },
  { id: "deuces", name: "Sea Salt Spanish Latte", where: "Deuces Coffee · Legazpi Village", desc: "Espresso, milk and condensed milk with a salted cream top. Rich and sweet." },
  { id: "habitual", name: "Frozen Flat White", where: "Habitual Coffee · Salcedo Village", desc: "A blended, icy take on the flat white. Strong coffee, creamy and cold." }
];
const OPTIONS = {
  temp: ["Iced", "Hot"],
  size: ["Regular", "Large"],
  milk: ["Full cream", "Oat", "Almond", "No milk"],
  sugar: ["0%", "25%", "50%", "100%"]
};
const DEFAULTS = { temp: "Iced", size: "Regular", milk: "Full cream", sugar: "50%" };

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("drinks").innerHTML = DRINKS.map(d => `
  <label class="drink">
    <input type="radio" name="drink" value="${d.id}">
    <div class="name">${esc(d.name)}</div>
    ${d.where ? `<div class="where">${esc(d.where)}</div>` : ""}
    <div class="desc">${esc(d.desc)}</div>
  </label>`).join("");

document.querySelectorAll(".seg").forEach(el => {
  const g = el.dataset.group;
  el.innerHTML = OPTIONS[g].map(v => `
    <label><input type="radio" name="${g}" value="${v}" ${v === DEFAULTS[g] ? "checked" : ""}>${v}</label>`).join("");
});

let qty = 1;
$("minus").onclick = () => { qty = Math.max(1, qty - 1); update(); };
$("plus").onclick = () => { qty = Math.min(10, qty + 1); update(); };

const val = n => (document.querySelector(`input[name="${n}"]:checked`) || {}).value;

function orderText() {
  const d = DRINKS.find(x => x.id === val("drink"));
  if (!d) return "";
  const m = val("milk");
  const milk = m === "No milk" ? "No milk" : (d.id === "americano" ? `${m} milk on the side` : `${m} milk`);
  const name = $("name").value.trim();
  const lines = [
    `☕ Coffee order${name ? " from " + name : ""}`,
    `${qty} × ${d.name}${d.where ? " (" + d.where.split(" · ")[0] + ")" : ""}`,
    `${val("temp")} · ${val("size")} · ${milk} · Sugar ${val("sugar")}`
  ];
  const notes = $("notes").value.trim();
  if (notes) lines.push(`Note: ${notes}`);
  return lines.join("\n");
}

// Apps Script web app that appends each order to the "Coffee Orders" Google Sheet.
const ORDER_URL = "https://script.google.com/macros/s/AKfycbwaGXEoqIW9qwcd2kpdB7tBNKF-TfLO5lZHW5ZeuyDIGSH2vklHL0QInL1h7fcKl68GiQ/exec";
let savedText = "";

function update() {
  $("qty").textContent = qty;
  const t = orderText();
  const ok = !!t;
  ["send", "copy"].forEach(id => $(id).setAttribute("aria-disabled", String(!ok)));
  const saved = ok && t === savedText;
  $("place").setAttribute("aria-disabled", String(!ok || saved));
  $("place").textContent = saved ? "✓ Order placed" : "Place order";
  $("summary").textContent = ok ? t.split("\n").slice(1, 3).join(" — ") : "Choose a drink to start";
}

async function placeOrder() {
  const t = orderText(); if (!t || t === savedText) return;
  const d = DRINKS.find(x => x.id === val("drink"));
  const order = {
    name: $("name").value.trim(), drink: d.name, cafe: d.where ? d.where.split(" · ")[0] : "",
    qty, temp: val("temp"), size: val("size"), milk: val("milk"), sugar: val("sugar"), notes: $("notes").value.trim()
  };
  $("place").setAttribute("aria-disabled", "true");
  $("place").textContent = "Placing…";
  try {
    // text/plain keeps this a "simple" request, so the browser skips the CORS preflight Apps Script can't answer.
    const res = await fetch(ORDER_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(order) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error);
    savedText = t;
    toast("Order placed — thank you!");
  } catch (err) {
    toast("Couldn't place order — please try again");
  }
  update();
}
$("place").onclick = placeOrder;

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200);
}

async function copy() {
  const t = orderText(); if (!t) return;
  try { await navigator.clipboard.writeText(t); }
  catch {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("Order copied — paste it in your chat");
}

$("copy").onclick = copy;
$("send").onclick = async e => {
  e.preventDefault();
  const t = orderText(); if (!t) return;
  if (navigator.share) {
    try { await navigator.share({ text: t }); return; } catch (err) { if (err.name === "AbortError") return; }
  }
  copy();
};

document.addEventListener("input", update);
document.addEventListener("change", update);
update();
</script>
</body>
</html>
